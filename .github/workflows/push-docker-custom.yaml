name: Deploy custom tagged images to GHCR

on:
  push:
    branches:
      - 'feature/bob-moneyflew'

jobs:
  push-store-image:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 'Build Inventory Image'
        run: |
          docker build . --tag ghcr.io/qubic/qubic-archiver-v2:bob-moneyflew
          docker push ghcr.io/qubic/qubic-archiver-v2:bob-moneyflew